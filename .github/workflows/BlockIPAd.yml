name: Update Loon BlockIPAd.lpx

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve domains and update Loon plugin
        shell: bash
        env:
          INPUT_FILE: domains.txt
          PLUGIN_FILE: Loon/LPX/BlockIPAd.lpx
        run: |
          set -euo pipefail

          test -f "$INPUT_FILE"
          test -f "$PLUGIN_FILE"

          tmp_rules="$(mktemp)"
          tmp_plugin="$(mktemp)"
          trap 'rm -f "$tmp_rules" "$tmp_plugin"' EXIT

          declare -A seen

          while IFS= read -r raw || [[ -n "$raw" ]]; do
            domain="${raw%%#*}"
            domain="$(printf '%s' "$domain" | xargs)"
            [[ -z "$domain" ]] && continue

            while IFS= read -r ip; do
              [[ -z "$ip" ]] && continue
              if [[ "$ip" == *:* ]]; then
                rule="IP-CIDR,${ip}/32,REJECT"
              else
                rule="IP-CIDR6,${ip}/128,REJECT"
              fi
              if [[ -z "${seen[$rule]+x}" ]]; then
                seen[$rule]=1
                printf '%s\n' "$rule" >> "$tmp_rules"
              fi
            done < <(getent ahosts "$domain" | awk '{print $1}' | sort -u)
          done < "$INPUT_FILE"

          sort -V "$tmp_rules" -o "$tmp_rules"

          awk -v rules_file="$tmp_rules" '
            BEGIN {
              while ((getline line < rules_file) > 0) rules[++count] = line
              close(rules_file)
              in_rule = 0
            }
            /^[[:space:]]*\[Rule\][[:space:]]*$/ {
              print
              for (i = 1; i <= count; i++) print rules[i]
              in_rule = 1
              next
            }
            in_rule && /^[[:space:]]*\[[^]]+\][[:space:]]*$/ {
              in_rule = 0
              print
              next
            }
            !in_rule { print }
          ' "$PLUGIN_FILE" > "$tmp_plugin"

          mv "$tmp_plugin" "$PLUGIN_FILE"

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add Loon/LPX/BlockIPAd.lpx
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto Update: BlockIPAd.lpx" && git push)
