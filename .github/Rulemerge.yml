name: Merge Rule Files

on:
  schedule:
    - cron: '0 0 1,16 * *'
  workflow_dispatch:

jobs:
  merge_and_push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download and Merge Files
      run: |
        echo "payload:" > merged.yaml

        curl -sL "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/tiktok.yaml" | grep -v "^payload:" >> merged.yaml

        curl -sL "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/category-ai-!cn.yaml" | grep -v "^payload:" >> merged.yaml

        echo "  - IP-CIDR,8.8.8.8/32" >> merged.yaml

        mv merged.yaml ./AiandTiktok.yaml

    - name: Commit and Push
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add AiandTiktok.yaml
        git commit -m "Update AiandTiktok.yaml: $(date +'%Y-%m-%d %H:%M:%S')" || exit 0
        git push
